name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege. A pull request from a fork runs untrusted code, so the
# token it gets must not be able to change anything. Read is all the suites
# need. Do not raise this without a specific reason, and do not switch the
# trigger to the trusted-context variant, which would run repository-context
# code against an attacker's branch.
permissions:
  contents: read

jobs:
  linux:
    name: calculator, references, provenance (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to immutable commit SHAs, not floating tags: a tag
      # can be repointed at new code by its owner.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false   # leave no token in the runner git config

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'

      # Only openpyxl, from the repository's own pinned requirements. No
      # external script is fetched and executed anywhere in this workflow.
      - name: Install workbook dependency
        run: python -m pip install --require-hashes=false -r requirements.txt

      - name: Release declarations and version history
        run: python scripts/release_version.py --check

      - name: Calculator regression tests
        run: python scripts/test_cfo_calc.py

      - name: Reference and documentation consistency
        run: python scripts/test_reference_consistency.py

      # Structural checks run here; the Excel engine tests skip on Linux by
      # design and are exercised on a Windows machine with Excel installed.
      # This job also asserts the workbook rebuild is byte-identical.
      - name: Workbook tests
        run: python scripts/test_workbook_excel.py

      - name: Signature and manifest verification
        run: python scripts/verify_signature.py
